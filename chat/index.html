<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>127IL &bull; CHAT OVERLAY TRANSPARENT</title><style>
    @font-face {
      font-family: "Glacial Indifference";
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url("/fonts/glacial-indifference-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "Glacial Indifference";
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: url("/fonts/glacial-indifference-700.woff2") format("woff2");
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: "Glacial Indifference", "Century Gothic", "Futura", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .obs-chat-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px;
      gap: 8px;
      overflow: hidden;
    }

    .chat-messages-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 100%;
      scroll-behavior: smooth;
    }
    .chat-messages-box::-webkit-scrollbar { display: none; }

    .chat-bubble {
      display: inline-block;
      align-self: flex-start;
      max-width: 95%;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px) saturate(150%);
      -webkit-backdrop-filter: blur(10px) saturate(150%);
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      color: #ffffff;
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
      animation: bubble-fade 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 2px #000;
    }
    @keyframes bubble-fade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .time-badge {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      margin-right: 6px;
      font-variant-numeric: tabular-nums;
    }

    .tag-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-right: 6px;
      vertical-align: middle;
    }
    .tag-twitch {
      background: #9146FF;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(145, 70, 255, 0.5);
    }
    .tag-host {
      background: #ffffff;
      color: #000000;
      font-weight: 900;
    }

    .author-name {
      font-weight: 700;
      font-size: 13px;
      margin-right: 6px;
    }

    .message-text {
      color: #ffffff;
    }
  </style></head><body><div class="obs-chat-container"><div class="chat-messages-box" id="messagesBox"></div></div><script>
    (function () {
      const messagesBox = document.getElementById('messagesBox');
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = wsProtocol + '//' + window.location.host + '/chat-ws';
      let ws = null;

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function addMessage(data) {
        const row = document.createElement('div');
        row.className = 'chat-bubble';

        let badgeHtml = '';
        if (data.badge === 'TWITCH' || data.role === 'twitch') {
          badgeHtml = '<span class="tag-badge tag-twitch">TWITCH</span>';
        } else if (data.role === 'host') {
          badgeHtml = '<span class="tag-badge tag-host">HÔTE</span>';
        } else if (data.badge) {
          badgeHtml = '<span style="margin-right:4px;">' + escapeHtml(data.badge) + '</span>';
        }

        const authorColor = data.color || '#ffffff';
        const authorEsc = escapeHtml(data.username || 'Anonyme');
        const textEsc = escapeHtml(data.content || '');

        row.innerHTML =
          badgeHtml +
          '<strong class="author-name" style="color:' + authorColor + ';">' + authorEsc + ' :</strong>' +
          '<span class="message-text">' + textEsc + '</span>';

        messagesBox.appendChild(row);

        // Limiter le nombre de messages affichés pour préserver la mémoire GPU OBS
        while (messagesBox.children.length > 50) {
          messagesBox.removeChild(messagesBox.firstChild);
        }

        // Auto-scroll
        messagesBox.scrollTop = messagesBox.scrollHeight;
      }

      function connectWs() {
        ws = new WebSocket(wsUrl);

        ws.onopen = function () {
          ws.send(JSON.stringify({ action: 'join', channel: 'live' }));
        };

        ws.onmessage = function (e) {
          try {
            const data = JSON.parse(e.data);
            if (data.type === 'history' && Array.isArray(data.messages)) {
              messagesBox.innerHTML = '';
              data.messages.forEach(addMessage);
            } else if (data.type === 'message') {
              addMessage(data);
            }
          } catch (err) {}
        };

        ws.onclose = function () {
          setTimeout(connectWs, 3000);
        };

        ws.onerror = function () {
          ws.close();
        };
      }

      connectWs();
    })();
  </script></body></html>
