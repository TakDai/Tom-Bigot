<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Multi-Motors : Moteur Brushless FPV haute visibilité -->
  <!-- Axe / Shaft central avec méplat -->
  <path d="M 30 5 L 34 5 L 34 18 L 30 18 Z" fill="#111111" stroke="none" />
  <circle cx="32" cy="5" r="2.2" fill="none" stroke="#111111" stroke-width="2" />

  <!-- Cloche supérieure vue en perspective (Bell) -->
  <ellipse cx="32" cy="22" rx="22" ry="9" stroke-width="2.6" />
  
  <!-- Face interne de la cloche -->
  <ellipse cx="32" cy="22" rx="15" ry="6" stroke-width="2.2" />

  <!-- Moyeu central -->
  <ellipse cx="32" cy="22" rx="5" ry="2.5" fill="#111111" stroke="none" />

  <!-- Rayons de ventilation de cloche (branches du moteur) -->
  <line x1="19" y1="18.5" x2="27" y2="20.5" stroke-width="2.4" />
  <line x1="17" y1="22.5" x2="27" y2="22.5" stroke-width="2.4" />
  <line x1="21" y1="26" x2="28.5" y2="23.5" stroke-width="2.4" />
  
  <line x1="45" y1="18.5" x2="37" y2="20.5" stroke-width="2.4" />
  <line x1="47" y1="22.5" x2="37" y2="22.5" stroke-width="2.4" />
  <line x1="43" y1="26" x2="35.5" y2="23.5" stroke-width="2.4" />

  <!-- Corps cylindrique du stator / rotor -->
  <path d="M 10 22 L 10 40 C 10 49 20 54 32 54 C 44 54 54 49 54 40 L 54 22" stroke-width="2.6" />

  <!-- Aimants néodyme et fentes stator -->
  <path d="M 18 31 L 18 43 M 25 33 L 25 46 M 32 34 L 32 47 M 39 33 L 39 46 M 46 31 L 46 43" stroke-width="2.2" />

  <!-- Socle de fixation inférieur -->
  <path d="M 23 54 L 23 58 C 23 59.5 27 60.5 32 60.5 C 37 60.5 41 59.5 41 58 L 41 54" stroke-width="2.4" fill="#111111" />
</svg>