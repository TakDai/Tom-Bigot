<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <!-- Quad FPV stylisé -->
  <g transform="translate(10, 10)">
    <!-- Châssis central en X -->
    <line x1="8" y1="8" x2="52" y2="52" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <line x1="52" y1="8" x2="8" y2="52" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <!-- Moteurs / Hélices -->
    <circle cx="8" cy="8" r="8" stroke="#000000" stroke-width="2.5" fill="#ffffff" />
    <circle cx="52" cy="8" r="8" stroke="#000000" stroke-width="2.5" fill="#ffffff" />
    <circle cx="8" cy="52" r="8" stroke="#000000" stroke-width="2.5" fill="#ffffff" />
    <circle cx="52" cy="52" r="8" stroke="#000000" stroke-width="2.5" fill="#ffffff" />
    <!-- Caméra FPV au centre -->
    <rect x="23" y="21" width="14" height="18" rx="2" stroke="#000000" stroke-width="2.5" fill="#000000" />
    <circle cx="30" cy="27" r="3.5" fill="#ffffff" />
  </g>
  <!-- Typographie DRONE FPV -->
  <text x="82" y="38" font-family="'Glacial Indifference', -apple-system, BlinkMacSystemFont, sans-serif" font-size="27" font-weight="900" letter-spacing="1.5" fill="#000000">DRONE FPV</text>
  <!-- Baseline -->
  <text x="84" y="56" font-family="'Glacial Indifference', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#555555">TOURNAGES CINÉMA &bull; CADRAGE AÉRIEN</text>
</svg>
