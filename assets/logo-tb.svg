<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- LOGO ANAMORPHOSE MONOGRAMME TB &bull; SANS FOND -->
  <g class="tb-anamorphose">
    <!-- 1. Plateau supérieur T en perspective axonométrique -->
    <polygon points="56,128 456,128 392,64 120,64" fill="currentColor" />
    
    <!-- 2. Ombre biseau gauche du plateau T -->
    <polygon points="56,128 120,128 120,64" fill="currentColor" opacity="0.4" />

    <!-- 3. Fût vertical T / Dos du B (Colonne vertébrale commune) -->
    <polygon points="120,128 196,128 196,448 120,448" fill="currentColor" />
    
    <!-- 4. Flanc gauche 3D en fuite axonométrique (Profondeur anamorphique) -->
    <polygon points="120,128 120,448 72,400 72,176" fill="currentColor" opacity="0.5" />

    <!-- 5. Boucle supérieure du B -->
    <path fill-rule="evenodd" d="
      M 196,128
      L 336,128
      C 396,128 428,162 428,214
      C 428,266 392,284 196,284
      L 196,226
      C 334,226 364,220 364,214
      C 364,188 334,184 196,184
      Z
    " fill="currentColor" opacity="0.9" />

    <!-- 6. Facette biseautée anamorphique reliant le plateau T à la boucle B -->
    <polygon points="336,128 392,64 456,128 400,128" fill="currentColor" opacity="0.6" />

    <!-- 7. Boucle inférieure du B -->
    <path fill-rule="evenodd" d="
      M 196,274
      L 348,274
      C 414,274 444,314 444,372
      C 444,430 394,448 196,448
      L 196,390
      C 340,390 380,384 380,372
      C 380,332 340,328 196,328
      Z
    " fill="currentColor" />

    <!-- 8. Facette intermédiaire de transition volumétrique -->
    <polygon points="348,274 388,234 416,274" fill="currentColor" opacity="0.4" />
  </g>
</svg>
