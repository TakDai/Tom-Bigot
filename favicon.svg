<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141721"/>
      <stop offset="50%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4252"/>
      <stop offset="100%" stop-color="#1e222d"/>
    </linearGradient>
  </defs>

  <!-- Fond squircle moderne sombre -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12"/>
  
  <!-- Filet intérieur lumineux ultra-fin -->
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Monogramme TB architecturé -->
  <g fill="url(#metalGrad)">
    <!-- T : Barre supérieure & fût vertical -->
    <path d="M 94 148 L 254 148 L 254 204 L 202 204 L 202 364 L 146 364 L 146 204 L 94 204 Z"/>

    <!-- B : Fût vertical & doubles boucles géométriques précises -->
    <path fill-rule="evenodd" d="
      M 258 148
      L 352 148
      C 390 148 418 168 418 202
      C 418 224 402 240 378 248
      C 410 258 426 278 426 312
      C 426 348 396 364 352 364
      L 258 364
      Z

      M 314 196
      L 348 196
      C 366 196 376 204 376 218
      C 376 232 366 240 348 240
      L 314 240
      Z

      M 314 272
      L 352 272
      C 372 272 384 282 384 298
      C 384 314 372 324 352 324
      L 314 324
      Z
    "/>
  </g>

  <!-- Point d'accent high-tech Cyan / Teal -->
  <circle cx="406" cy="130" r="15" fill="#00e5ff"/>
  <circle cx="406" cy="130" r="7" fill="#ffffff"/>
</svg>