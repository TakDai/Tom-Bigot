<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    :root { color: #000000; }
    @media (prefers-color-scheme: dark) { :root { color: #ffffff; } }
    .tb-wire { stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Cube top face -->
  <polygon class="tb-wire" points="18,34 50,18 82,34 50,50" stroke-width="4.5" />
  <!-- Central vertical spine -->
  <line class="tb-wire" x1="50" y1="50" x2="50" y2="88" stroke-width="5" />
  <!-- Upper loop of B -->
  <path class="tb-wire" d="M 50,50 L 74,38 C 84,33 86,45 78,54 L 50,68" stroke-width="4.5" />
  <!-- Lower loop of B -->
  <path class="tb-wire" d="M 50,68 L 76,55 C 86,50 88,65 76,75 L 50,88" stroke-width="4.5" />

</svg>
