<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <!-- Symbole architectural 7 Écrans -->
  <g transform="translate(10, 12)">
    <rect x="2" y="2" width="52" height="52" stroke="#000000" stroke-width="3" fill="#ffffff" />
    <!-- 7 rayures / écrans -->
    <line x1="10" y1="12" x2="10" y2="44" stroke="#000000" stroke-width="2.5" />
    <line x1="16" y1="12" x2="16" y2="44" stroke="#000000" stroke-width="2.5" />
    <line x1="22" y1="12" x2="22" y2="44" stroke="#000000" stroke-width="2.5" />
    <line x1="28" y1="12" x2="28" y2="44" stroke="#000000" stroke-width="2.5" />
    <line x1="34" y1="12" x2="34" y2="44" stroke="#000000" stroke-width="2.5" />
    <line x1="40" y1="12" x2="40" y2="44" stroke="#000000" stroke-width="2.5" />
    <line x1="46" y1="12" x2="46" y2="44" stroke="#000000" stroke-width="2.5" />
  </g>
  <!-- Typographie LES STUDIOS -->
  <text x="78" y="38" font-family="'Glacial Indifference', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="#000000">LES STUDIOS</text>
  <!-- Baseline -->
  <text x="80" y="56" font-family="'Glacial Indifference', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#555555">CINÉMAS ART &amp; ESSAI &bull; 7 ÉCRANS &bull; TOURS</text>
</svg>
